# Directus の DB を SQLite から Postgres に切り替える override。
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# 注意: SQLite 用のデータは引き継ぎません（新規の Postgres に schema を適用します）。
# POSTGRES_PASSWORD は .env で設定してください。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_DB: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 5s
      timeout: 4s
      retries: 12

  # 既定の POSTGRES_PASSWORD のまま公開しないよう、directus-init の検査対象に加える
  directus-init:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  directus:
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
